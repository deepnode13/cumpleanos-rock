<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alles Gute zum 16. Geburtstag!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de Inicio -->
  <div id="pantalla-inicio" class="pantalla-inicio">
    <div class="contenido-bienvenida">
      <div class="icono-carrera">🏃‍♀️</div>
      <h1>BEREIT FÜR DEN LAUF!</h1>
      <p>Presiona el botón para iniciar la carrera</p>
      <button id="btn-iniciar" class="btn-inicio">START!</button>
    </div>
  </div>

  <!-- Escenario Deportivo -->
  <div class="estadio">
    
    <!-- Gradas (Tribunas) -->
    <div class="gradas-contenedor">
      <div class="reflectores">
        <div class="foco f-izq"></div>
        <div class="foco f-der"></div>
      </div>

      <!-- Cartel de felicitación durante el recorrido -->
      <div id="cartel-gradas" class="cartel-gradas oculto">
        <h2>¡ALLES GUTE ZUM GEBURTSTAG ANNETTE!</h2>
        <p>🏃‍♀️ Lauf weiter! 🏃‍♀️</p>
      </div>

      <!-- Siluetas de Espectadores (Sin emojis) -->
      <div class="publico-siluetas">
        <div class="silueta s1"></div>
        <div class="silueta s2"></div>
        <div class="silueta s3"></div>
        <div class="silueta s4"></div>
        <div class="silueta s5"></div>
        <div class="silueta s6"></div>
        <div class="silueta s7"></div>
        <div class="silueta s8"></div>
      </div>
    </div>

    <!-- Pista de Atletismo -->
    <div id="pista" class="pista">
      <div class="linea c1"></div>
      <div class="linea c2"></div>
      <div class="linea c3"></div>
      <div class="numero-carril">16</div>

      <!-- Arco de Meta -->
      <div id="meta" class="meta oculto">
        <div class="cinta-meta">ZIEL</div>
        <div class="poste poste-izq"></div>
        <div class="poste poste-der"></div>
      </div>

      <!-- Corredora SVG con escala proporcional -->
      <div id="corredora" class="corredora-wrapper">
        <svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMid meet" class="corredora-svg">
          <!-- Sombra -->
          <ellipse cx="50" cy="115" rx="20" ry="4" fill="rgba(0,0,0,0.3)" />
          <!-- Coleta -->
          <path class="pelo" d="M 45 25 Q 28 20 22 35" stroke="#4a2e16" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Cabeza -->
          <circle cx="50" cy="22" r="10" fill="#ffdbac" stroke="#333" stroke-width="2"/>
          <!-- Top -->
          <path d="M 42 32 L 58 32 L 55 58 L 45 58 Z" fill="#ff3366" stroke="#333" stroke-width="2"/>
          <!-- Shorts -->
          <path d="M 44 58 L 56 58 L 58 70 L 42 70 Z" fill="#222" stroke="#333" stroke-width="2"/>
          <!-- Brazos -->
          <g class="brazo-izq">
            <line x1="45" y1="36" x2="30" y2="50" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
            <line x1="30" y1="50" x2="20" y2="40" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
          </g>
          <g class="brazo-der">
            <line x1="55" y1="36" x2="70" y2="48" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
            <line x1="70" y1="48" x2="80" y2="60" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
          </g>
          <!-- Piernas -->
          <g class="pierna-izq">
            <line x1="46" y1="70" x2="35" y2="90" stroke="#ffdbac" stroke-width="6" stroke-linecap="round"/>
            <line x1="35" y1="90" x2="25" y2="110" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="22" cy="110" rx="6" ry="3" fill="#fff" />
          </g>
          <g class="pierna-der">
            <line x1="54" y1="70" x2="65" y2="88" stroke="#ffdbac" stroke-width="6" stroke-linecap="round"/>
            <line x1="65" y1="88" x2="75" y2="108" stroke="#ffdbac" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="78" cy="108" rx="6" ry="3" fill="#fff" />
          </g>
        </svg>
      </div>

    </div>

    <!-- Mensaje Final al cruzar la meta -->
    <div id="mensaje-final" class="mensaje-final oculto">
      <h1>ALLES GUTE ZUM 16. GEBURTSTAG!</h1>
      <p>🏆 Du hast das Ziel erreicht! 🏆</p>
    </div>

  </div>

  <audio id="musica" src="audio/happyrock.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
