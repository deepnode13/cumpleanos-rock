<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Rock Run - Massive Stands</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librería Canvas Confetti desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Pantalla de Inicio / Play -->
  <div id="pantalla-inicio" class="pantalla-inicio">
    <div class="tarjeta-bienvenida">
      <span class="icono-rock">🎸⚡</span>
      <h1>ROCK & RUN BIRTHDAY</h1>
      <p>Presiona para iniciar la carrera</p>
      <button id="btn-iniciar" class="btn-rock">¡START ROCKING! 🤘</button>
    </div>
  </div>

  <!-- Contenedor Principal del Escenario / Estadio -->
  <div class="estadio-contenedor">

    <!-- Gradas y Público Rockero (OCUPAN CASI TODA LA PANTALLA) -->
    <div class="gradas-contenedor">
      
      <!-- Efectos de Luces y Fuego de Concierto dentro de las gradas -->
      <div id="luces-escenario" class="luces-escenario">
        <div class="luz luz-izq"></div>
        <div class="luz luz-der"></div>
        <div class="luz luz-centro"></div>
      </div>

      <div id="fuego-escenario" class="fuego-escenario oculto">
        <div class="flama f1">🔥</div>
        <div class="flama f2">🔥</div>
        <div class="flama f3">🔥</div>
        <div class="flama f4">🔥</div>
        <div class="flama f5">🔥</div>
      </div>

      <div class="reflectores">
        <div class="foco f-izq"></div>
        <div class="foco f-der"></div>
      </div>

      <!-- Cartel de Felicitación durante la carrera (Alemán) -->
      <div id="cartel-gradas" class="cartel-gradas">
        <h2>ALLES GUTE ZUM GEBURTSTAG ANNETTE! 🤘</h2>
        <p>🏃‍♀️ Lauf weiter! 🏃‍♀️</p>
      </div>

      <!-- Público Rockero (Múltiples filas para llenar el espacio) -->
      <div class="tribuna">
        <div class="fila-publico">
          <span class="rocker r1">👨‍🎤</span><span class="rocker r2">🤘</span><span class="rocker r3">🎸</span><span class="rocker r4">👩‍🎤</span><span class="rocker r5">🔥</span>
        </div>
        <div class="fila-publico">
          <span class="rocker r6">⚡</span><span class="rocker r7">🤘</span><span class="rocker r8">🎤</span><span class="rocker r1">👩‍🎤</span><span class="rocker r3">🤘</span>
        </div>
        <div class="fila-publico">
          <span class="rocker r5">🎸</span><span class="rocker r2">👨‍🎤</span><span class="rocker r4">👩‍🎤</span><span class="rocker r6">🤘</span><span class="rocker r8">🎸</span>
        </div>
         <div class="fila-publico">
          <span class="rocker r1">👨‍🎤</span><span class="rocker r2">🤘</span><span class="rocker r3">🎸</span><span class="rocker r4">👩‍🎤</span><span class="rocker r5">🔥</span>
        </div>
        <div class="fila-publico oculto-movil">
          <span class="rocker r6">⚡</span><span class="rocker r7">🤘</span><span class="rocker r8">🎤</span><span class="rocker r1">👩‍🎤</span><span class="rocker r3">🤘</span>
        </div>
      </div>
    </div>

    <!-- Pista de Atletismo (EN LA PARTE INFERIOR, UN POCO MENOS DE LA MITAD) -->
    <div id="pista" class="pista">
      <div class="linea-carril c1"></div>
      <div class="linea-carril c2"></div>

      <!-- Corredora -->
      <div id="corredora" class="corredora">
        <svg viewBox="0 0 100 120" class="svg-corredora">
          <!-- Cabello largo rockero -->
          <path d="M 35 25 Q 20 40 30 75" stroke="#e6005c" stroke-width="8" fill="none" stroke-linecap="round"/>
          <path d="M 65 25 Q 80 40 70 75" stroke="#e6005c" stroke-width="8" fill="none" stroke-linecap="round"/>
          <!-- Cabeza -->
          <circle cx="50" cy="25" r="14" fill="#f1c27d"/>
          <ellipse cx="50" cy="18" rx="15" ry="6" fill="#111"/> <!-- Cinta rockera -->
          <!-- Torso / Playera Rock -->
          <path d="M 40 39 L 60 39 L 57 75 L 43 75 Z" fill="#111"/>
          <!-- Detalle de relámpago en playera -->
          <path d="M 52 45 L 46 57 L 51 57 L 47 69 L 55 54 L 50 54 Z" fill="#ffcc00"/>
          <!-- Brazos -->
          <g class="brazo-izq">
            <path d="M 40 42 L 25 58 L 15 50" stroke="#f1c27d" stroke-width="6" fill="none" stroke-linecap="round"/>
          </g>
          <g class="brazo-der">
            <path d="M 60 42 L 75 58 L 85 50" stroke="#f1c27d" stroke-width="6" fill="none" stroke-linecap="round"/>
          </g>
          <!-- Piernas animadas -->
          <g class="pierna-izq">
            <path d="M 45 75 L 30 95 L 40 115" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>
            <ellipse cx="42" cy="115" rx="7" ry="4" fill="#ff0055"/> <!-- Tenis -->
          </g>
          <g class="pierna-der">
            <path d="M 55 75 L 70 95 L 60 115" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>
            <ellipse cx="62" cy="115" rx="7" ry="4" fill="#ff0055"/> <!-- Tenis -->
          </g>
        </svg>
      </div>

      <!-- Meta (Arco de llegada) -->
      <div id="meta" class="meta oculto">
        <div class="poster-meta">FINISH</div>
        <div class="cinta-meta"></div>
      </div>
    </div>

  </div>

  <!-- Cartel Emergente Final (Alemán - Felices 16 años) -->
  <div id="mensaje-final" class="modal-final oculto">
    <div class="contenido-modal">
      <div class="icono-corona">👑🎸</div>
      <h2>HERZLICHEN GLÜCKWUNSCH ZUM 16. GEBURTSTAG!</h2>
      <p>¡Has alcanzado la meta como toda una leyenda del Rock!</p>
      <div class="fuegos-emojis">🔥⚡🎉🎸💥</div>
    </div>
  </div>

  <!-- Reproductor de Audio -->
  <audio id="musica" src="audio/happyrock.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
